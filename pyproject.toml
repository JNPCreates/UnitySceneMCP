[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-scene-mcp"
version = "0.1.0"
description = "MCP server and Unity Editor bridge for manipulating Unity scenes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/JNPCreates/UnitySceneMCP"
Repository = "https://github.com/JNPCreates/UnitySceneMCP"
Issues = "https://github.com/JNPCreates/UnitySceneMCP/issues"

[project.scripts]
unity-scene-mcp = "mcp_server.server:main"
unity-scene-mcp-install-bridge = "mcp_server.install_bridge:main"

[tool.setuptools.packages.find]
include = ["mcp_server*"]

[tool.setuptools.package-data]
mcp_server = ["MCPBridge.cs"]
